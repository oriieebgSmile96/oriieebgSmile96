<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Orieb Alzyuot — Senior Front-End and Full-Stack Web &amp; Mobile Developer, floating in purple space">
  <defs>
    <radialGradient id="space" cx="70%" cy="30%" r="90%">
      <stop offset="0" stop-color="#5B21B6"/>
      <stop offset="0.5" stop-color="#2E1065"/>
      <stop offset="1" stop-color="#12042B"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="0.5" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <style>
    @keyframes float   { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }
    @keyframes floatR  { 0%,100% { transform: translateY(0px) rotate(-12deg); } 50% { transform: translateY(-12px) rotate(-6deg); } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes spark   { 0%,100% { transform: scale(.7) rotate(0deg); opacity:.5; } 50% { transform: scale(1.15) rotate(45deg); opacity:1; } }
    @keyframes shoot   { 0% { transform: translate(-260px, 120px); opacity:0; } 8% { opacity:1; } 30% { transform: translate(0,0); opacity:0; } 100% { transform: translate(0,0); opacity:0; } }
    @keyframes orbit   { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes ring    { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(-10deg); } }
    @keyframes swim    { 0%,100% { transform: translateX(0) translateY(0); } 50% { transform: translateX(14px) translateY(-6px); } }
    @keyframes steam   { 0% { transform: translateY(0); opacity:.8; } 100% { transform: translateY(-10px); opacity:0; } }
    @keyframes type    { 0%,100% { width: 30px; } 50% { width: 80px; } }
    @keyframes caret   { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes blink   { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes pulse   { 0%,100% { opacity:.28; } 50% { opacity:.5; } }
    @keyframes nebula  { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-16px, 8px) scale(1.06); } }
    @keyframes shimmer { 0% { opacity:.6; } 50% { opacity:1; } 100% { opacity:.6; } }
    .a { transform-box: fill-box; transform-origin: center; }
    .nebula  { animation: nebula 14s ease-in-out infinite; }
    .girl    { animation: float 4s ease-in-out infinite; }
    .coffee  { animation: floatR 5s ease-in-out infinite; }
    .star    { animation: twinkle 3s ease-in-out infinite; }
    .spark   { animation: spark 4s ease-in-out infinite; }
    .shoot   { animation: shoot 7s ease-in infinite; }
    .planet  { animation: float 6s ease-in-out infinite; }
    .ring    { animation: ring 8s ease-in-out infinite; }
    .moon    { animation: orbit 18s linear infinite; }
    .whale   { animation: swim 6s ease-in-out infinite; }
    .steam   { animation: steam 2.2s ease-out infinite; }
    .typing  { animation: type 3.2s steps(12) infinite; }
    .caret   { animation: caret 1s step-end infinite; }
    .eye     { animation: blink 5s ease-in-out infinite; }
    .tag     { animation: pulse 3s ease-in-out infinite; }
    .shine   { animation: shimmer 3s ease-in-out infinite; }
  </style>

  <!-- deep space -->
  <rect width="1000" height="360" rx="28" fill="url(#space)"/>
  <g transform="rotate(-18 820 80)"><ellipse class="a nebula" cx="820" cy="80" rx="260" ry="90" fill="#A855F7" opacity=".14" filter="url(#glow)"/></g>
  <ellipse class="a nebula" style="animation-delay:-7s" cx="150" cy="320" rx="220" ry="60" fill="#C084FC" opacity=".12" filter="url(#glow)"/>

  <!-- stars (twinkling) -->
  <g fill="#F5F3FF">
    <circle class="star" cx="60" cy="40" r="1.6"/><circle class="star" style="animation-delay:-1s" cx="130" cy="90" r="1.2"/><circle class="star" style="animation-delay:-2s" cx="40" cy="150" r="1.4"/>
    <circle class="star" style="animation-delay:-.5s" cx="420" cy="30" r="1.8"/><circle class="star" style="animation-delay:-1.5s" cx="500" cy="60" r="1.2"/><circle class="star" style="animation-delay:-2.5s" cx="560" cy="24" r="1.4"/>
    <circle class="star" style="animation-delay:-.8s" cx="640" cy="70" r="2"/><circle class="star" style="animation-delay:-1.8s" cx="720" cy="36" r="1.2"/><circle class="star" style="animation-delay:-2.8s" cx="790" cy="140" r="1.4"/>
    <circle class="star" style="animation-delay:-.3s" cx="880" cy="40" r="1.6"/><circle class="star" style="animation-delay:-1.3s" cx="950" cy="110" r="1.4"/><circle class="star" style="animation-delay:-2.3s" cx="970" cy="220" r="1.8"/>
    <circle class="star" style="animation-delay:-.9s" cx="900" cy="300" r="1.4"/><circle class="star" style="animation-delay:-1.9s" cx="700" cy="330" r="1.2"/><circle class="star" style="animation-delay:-2.9s" cx="600" cy="300" r="1.6"/>
    <circle class="star" style="animation-delay:-.6s" cx="320" cy="60" r="1.2"/><circle class="star" style="animation-delay:-1.6s" cx="360" cy="330" r="1.4"/><circle class="star" style="animation-delay:-2.6s" cx="240" cy="30" r="1.4"/>
  </g>
  <g fill="#F0ABFC">
    <path class="a spark" d="M470 110 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path class="a spark" style="animation-delay:-1.3s" d="M930 160 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
    <path class="a spark" style="animation-delay:-2.6s" d="M300 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path class="a spark" style="animation-delay:-.7s" d="M690 250 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z" opacity=".8"/>
  </g>

  <!-- shooting star -->
  <g class="shoot">
    <path d="M600 90 L700 50" stroke="#F5F3FF" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <circle cx="700" cy="50" r="3" fill="#FFFFFF" filter="url(#softglow)"/>
  </g>

  <!-- ringed planet with orbiting moon -->
  <g class="a planet" style="animation-delay:-2s">
    <g transform="translate(880 250)">
      <circle r="34" fill="url(#planet)"/>
      <ellipse class="a ring" rx="58" ry="14" fill="none" stroke="#E9D5FF" stroke-width="4" opacity=".8"/>
      <circle cx="-10" cy="-8" r="6" fill="#F5F3FF" opacity=".35"/>
      <g class="moon" style="transform-origin: 0px 0px">
        <circle cx="0" cy="-52" r="6" fill="#C4B5FD"/>
      </g>
    </g>
  </g>
  <!-- small moon -->
  <g class="a planet" style="animation-delay:-4s">
    <circle cx="560" cy="290" r="12" fill="#C4B5FD"/>
    <circle cx="556" cy="286" r="3" fill="#A78BFA"/>
    <circle cx="565" cy="293" r="2" fill="#A78BFA"/>
  </g>

  <!-- ORIEB illustration: floating astronaut-dev girl -->
  <g transform="translate(70,40)">
    <ellipse class="a tag" cx="130" cy="250" rx="110" ry="14" fill="#A855F7" opacity=".25" filter="url(#glow)"/>

    <g class="a girl">
      <!-- body (space suit) -->
      <path d="M70 232c0-40 26-66 60-66s60 26 60 66z" fill="url(#suit)"/>
      <path d="M110 176q20 -10 40 0v22q-20 -8 -40 0z" fill="#A78BFA"/>
      <!-- suit badge: smile -->
      <circle cx="150" cy="208" r="10" fill="#7C3AED"/>
      <circle cx="146" cy="206" r="1.4" fill="#F5F3FF"/><circle cx="154" cy="206" r="1.4" fill="#F5F3FF"/>
      <path d="M145 211q5 4 10 0" stroke="#F5F3FF" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- arms -->
      <path d="M78 202q-22 20 -22 36" stroke="#EDE9FE" stroke-width="15" stroke-linecap="round" fill="none"/>
      <path d="M182 202q22 20 22 36" stroke="#EDE9FE" stroke-width="15" stroke-linecap="round" fill="none"/>

      <!-- neck + head -->
      <rect x="120" y="144" width="20" height="26" rx="8" fill="#F5E6FF"/>
      <circle cx="130" cy="116" r="40" fill="#F5E6FF"/>

      <!-- long wavy purple hair -->
      <path d="M90 112c-2-52 30-78 68-70 26 6 42 30 40 66-4-16-14-28-34-34-12 10-30 16-50 14-10 6-18 14-24 24z" fill="url(#hair)"/>
      <path d="M90 108c-24 32-26 90-8 126 8-32 8-66 20-96z" fill="url(#hair)"/>
      <path d="M170 108c24 32 26 90 8 126-8-32-8-66-20-96z" fill="url(#hair)"/>
      <circle cx="178" cy="72" r="15" fill="url(#hair)"/>
      <circle cx="178" cy="72" r="5" fill="#C4B5FD" opacity=".6"/>

      <!-- helmet ring -->
      <circle cx="130" cy="112" r="56" fill="#C084FC" opacity=".12"/>
      <circle cx="130" cy="112" r="56" fill="none" stroke="#E9D5FF" stroke-width="2.5" opacity=".7"/>
      <path class="shine" d="M92 76q18 -20 40 -18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity=".6"/>

      <!-- face — big smile, blinking eyes -->
      <ellipse class="a eye" cx="116" cy="116" rx="3.6" ry="3.6" fill="#3B0764"/>
      <ellipse class="a eye" cx="144" cy="116" rx="3.6" ry="3.6" fill="#3B0764"/>
      <path d="M114 128q16 14 32 0" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="104" cy="126" r="5.5" fill="#F0ABFC" opacity=".6"/>
      <circle cx="156" cy="126" r="5.5" fill="#F0ABFC" opacity=".6"/>
      <!-- glasses -->
      <g fill="none" stroke="#7C3AED" stroke-width="2.4">
        <rect x="104" y="106" width="24" height="18" rx="7"/>
        <rect x="132" y="106" width="24" height="18" rx="7"/>
        <path d="M128 115h4"/>
      </g>

      <!-- laptop -->
      <path d="M40 232 L54 176 L206 176 L220 232 Z" fill="#1E0B3D"/>
      <path d="M50 228 L60 182 L200 182 L210 228 Z" fill="url(#screen)"/>
      <rect x="30" y="230" width="200" height="8" rx="4" fill="#7C3AED"/>
      <g fill="#7C3AED">
        <rect x="70" y="190" width="36" height="4" rx="2"/>
        <rect x="76" y="198" width="70" height="4" rx="2" fill="#A855F7"/>
        <rect x="76" y="206" width="50" height="4" rx="2"/>
        <rect class="typing" x="82" y="214" height="4" rx="2" fill="#C084FC" width="30"/>
        <rect class="caret" x="166" y="212" width="2" height="8" fill="#6D28D9"/>
      </g>
    </g>

    <!-- floating coffee -->
    <g transform="translate(236 150)">
      <g class="a coffee">
        <rect x="0" y="0" width="22" height="24" rx="4" fill="#F5F3FF"/>
        <path d="M22 7q10 0 10 8t-10 8" stroke="#F5F3FF" stroke-width="3.5" fill="none"/>
        <g class="steam"><path d="M7 -6q3 -5 0 -10" stroke="#F0ABFC" stroke-width="2" fill="none"/></g>
        <g class="steam" style="animation-delay:-1.1s"><path d="M15 -6q3 -5 0 -10" stroke="#F0ABFC" stroke-width="2" fill="none"/></g>
      </g>
    </g>

    <!-- whale (fish & whale mindset) -->
    <g class="a whale">
      <g transform="translate(-30 270) scale(.55)">
        <path d="M0 20q30 -30 80 -10q30 12 60 0q-10 20 -30 24q-40 8 -80 -4q-20 -6 -30 -10z" fill="#C4B5FD"/>
        <path d="M140 10q14 -18 26 -8q-8 6 -10 18q-8 -4 -16 -10z" fill="#C4B5FD"/>
        <circle cx="30" cy="16" r="3" fill="#2E1065"/>
        <path d="M60 -4q0 -14 8 -20M60 -4q0 -14 -6 -20" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>
    </g>
  </g>

  <!-- text -->
  <text x="360" y="104" fill="#F5F3FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800">Orieb Alzyuot</text>
  <text class="shine" x="682" y="104" fill="#F0ABFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30">✨</text>
  <text x="360" y="146" fill="#E9D5FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Senior Front-End · Full-Stack Web &amp; Mobile Developer</text>
  <text x="360" y="180" fill="#DDD6FE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">6+ years  ·  Angular  ·  React / React Native  ·  Node  ·  .NET Core  ·  Azure  ·  Docker</text>
  <text x="360" y="212" fill="#C4B5FD" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-style="italic">Amman  |  Remote / Relocation  |  Open to work  |  next stop: AI 🤖</text>

  <!-- Human-first tag -->
  <g transform="translate(360 240)">
    <rect class="tag" width="232" height="34" rx="17" fill="#F0ABFC"/>
    <rect width="232" height="34" rx="17" fill="none" stroke="#F0ABFC" stroke-width="1.5" opacity=".8"/>
    <text x="116" y="23" text-anchor="middle" fill="#F5F3FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">💜 Human-first, always</text>
  </g>
  <!-- Smile tag -->
  <g transform="translate(604 240)">
    <rect class="tag" style="animation-delay:-1.5s" width="214" height="34" rx="17" fill="#A855F7"/>
    <rect width="214" height="34" rx="17" fill="none" stroke="#E9D5FF" stroke-width="1.5" opacity=".7"/>
    <text x="107" y="23" text-anchor="middle" fill="#F5F3FF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Smile ☁️ ✨ 🐋  ·  the Orieb way</text>
  </g>

  <!-- code tag -->
  <g font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700" fill="#F5F3FF" opacity=".85">
    <text x="600" y="320" fill="#E9D5FF">{ humans → design → code → smile }</text>
  </g>
</svg>
